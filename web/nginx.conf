server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # L'API Go, jointe par son nom de service dans docker compose.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le service worker et l'index ne doivent jamais rester en cache, sinon la mise à jour de l'app bloque.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Application monopage : toute autre route renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
