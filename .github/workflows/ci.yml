name: CI

# Vérifie le code de chaque branche et de chaque pull request. Rien ne part sur le serveur d'ici :
# sur main, le workflow « Déployer » refait ces vérifications puis attend ton feu vert.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: api/go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
