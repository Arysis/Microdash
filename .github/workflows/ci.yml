name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: api/go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build

  # Sur un tag vX.Y.Z, publie les images sur ghcr.io pour la prod.
  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix: { service: [api, web] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/arysis/microdash-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/arysis/microdash-${{ matrix.service }}:latest
